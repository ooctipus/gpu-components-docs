site_name: GPU Components
site_url: https://ooctipus.github.io/gpu-components-docs/
docs_dir: docs
site_description: GPU-resident instance directory, growable typed storage, virtual-memory backing, and count-driven graph replay
repo_url: https://github.com/ooctipus/gpu-components-docs
theme:
  name: material
  features: [navigation.sections, toc.integrate, content.code.copy]
  palette:
    - scheme: default
      primary: black
nav:
  - Introduction: index.md
markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
