<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200"><rect width="720" height="200" fill="white"/><text x="40" y="28" font-size="14" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827">One captured graph, five replays, five different counts</text><text x="40" y="60" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">live_count on the device</text><text x="200" y="60" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">rows the kernel node runs (capacity 32, dashed)</text><rect x="90" y="100" width="60" height="50" rx="8" fill="#fef3c7" stroke="#1f2937"/><text x="120" y="92" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6b7280">count[]</text><text x="120" y="130" text-anchor="middle" font-size="16" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827"><tspan>16<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0;0.200;1" dur="10s" repeatCount="indefinite"/></tspan></text><text x="120" y="130" text-anchor="middle" font-size="16" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827"><tspan>24<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.200;0.400;1" dur="10s" repeatCount="indefinite"/></tspan></text><text x="120" y="130" text-anchor="middle" font-size="16" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827"><tspan>24<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.400;0.600;1" dur="10s" repeatCount="indefinite"/></tspan></text><text x="120" y="130" text-anchor="middle" font-size="16" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827"><tspan>20<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.600;0.800;1" dur="10s" repeatCount="indefinite"/></tspan></text><text x="120" y="130" text-anchor="middle" font-size="16" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827"><tspan>8<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.800;1.000;1" dur="10s" repeatCount="indefinite"/></tspan></text><rect x="200" y="112" width="480" height="26" rx="4" fill="none" stroke="#9ca3af" stroke-dasharray="4 4"/><rect x="200" y="112" height="26" rx="4" fill="#2563eb"><animate attributeName="width" values="240;360;360;300;120;240" keyTimes="0.000;0.200;0.400;0.600;0.800;1" dur="10s" calcMode="discrete" repeatCount="indefinite"/></rect><path d="M150 125 H196" stroke="#1f2937" stroke-width="1.5"/><text x="40" y="170" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827"><tspan>replay 1: updater reads live = 16, resizes the kernel to 16 rows and skips the rest.<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0;0.200;1" dur="10s" repeatCount="indefinite"/></tspan></text><text x="40" y="170" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827"><tspan>replay 2: updater reads live = 24, resizes the kernel to 24 rows and skips the rest.<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.200;0.400;1" dur="10s" repeatCount="indefinite"/></tspan></text><text x="40" y="170" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827"><tspan>replay 3: updater reads live = 24, resizes the kernel to 24 rows and skips the rest.<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.400;0.600;1" dur="10s" repeatCount="indefinite"/></tspan></text><text x="40" y="170" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827"><tspan>replay 4: updater reads live = 20, resizes the kernel to 20 rows and skips the rest.<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.600;0.800;1" dur="10s" repeatCount="indefinite"/></tspan></text><text x="40" y="170" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827"><tspan>replay 5: updater reads live = 8, resizes the kernel to 8 rows and skips the rest.<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.800;1.000;1" dur="10s" repeatCount="indefinite"/></tspan></text><text x="40" y="190" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6b7280">no re-capture, no host readback, one cudaGraphLaunch per replay</text></svg>