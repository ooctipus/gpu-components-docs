<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" width="640" height="190"><rect width="640" height="190" fill="white"/><text x="60" y="28" font-size="14" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827">One reservation, physical pages mapped as the population grows</text><text x="60" y="55" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">reserved: 4 granules of virtual address (2 MiB each)</text><rect x="60" y="70" width="116" height="40" rx="4" fill="#e5e7eb" stroke="#9ca3af"><animate attributeName="fill" values="#e5e7eb;#60a5fa;#60a5fa;#60a5fa" keyTimes="0;0;0.250;1" dur="8s" repeatCount="indefinite"/></rect><text x="118.0" y="95" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827">granule 0</text><rect x="180" y="70" width="116" height="40" rx="4" fill="#e5e7eb" stroke="#9ca3af"><animate attributeName="fill" values="#e5e7eb;#e5e7eb;#60a5fa;#60a5fa" keyTimes="0;0.250;0.500;1" dur="8s" repeatCount="indefinite"/></rect><text x="238.0" y="95" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827">granule 1</text><rect x="300" y="70" width="116" height="40" rx="4" fill="#e5e7eb" stroke="#9ca3af"><animate attributeName="fill" values="#e5e7eb;#e5e7eb;#60a5fa;#60a5fa" keyTimes="0;0.500;0.750;1" dur="8s" repeatCount="indefinite"/></rect><text x="358.0" y="95" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827">granule 2</text><rect x="420" y="70" width="116" height="40" rx="4" fill="#e5e7eb" stroke="#9ca3af"><animate attributeName="fill" values="#e5e7eb;#e5e7eb;#60a5fa;#60a5fa" keyTimes="0;0.750;1.000;1" dur="8s" repeatCount="indefinite"/></rect><text x="478.0" y="95" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827">granule 3</text><g><line x1="0" y1="60" x2="0" y2="120" stroke="#dc2626" stroke-width="3"><animate attributeName="x1" values="60;180;300;420;540" keyTimes="0.000;0.250;0.500;0.750;1" dur="8s" calcMode="discrete" repeatCount="indefinite"/><animate attributeName="x2" values="60;180;300;420;540" keyTimes="0.000;0.250;0.500;0.750;1" dur="8s" calcMode="discrete" repeatCount="indefinite"/></line><text y="135" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#dc2626" text-anchor="middle">ready<animate attributeName="x" values="60;180;300;420;540" keyTimes="0.000;0.250;0.500;0.750;1" dur="8s" calcMode="discrete" repeatCount="indefinite"/></text></g><text x="60" y="170" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827"><tspan>Reserve virtual address space for every row. It costs no memory yet.<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0;0.250;1" dur="8s" repeatCount="indefinite"/></tspan></text><text x="60" y="170" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827"><tspan>Map granule 1 when more rows are needed. No reader has to wait; nothing can address it yet.<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.250;0.500;1" dur="8s" repeatCount="indefinite"/></tspan></text><text x="60" y="170" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827"><tspan>After mapping and access succeed, publish readiness. Kernels may now use those rows.<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.500;0.750;1" dur="8s" repeatCount="indefinite"/></tspan></text><text x="60" y="170" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827"><tspan>Rows are initialized, then admitted. Growth happened under the running graph.<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.750;1.000;1" dur="8s" repeatCount="indefinite"/></tspan></text><text x="60" y="186" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6b7280">grey = reserved only, blue = mapped, red line = ready prefix</text></svg>