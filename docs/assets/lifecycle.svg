<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" height="180"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f2937"/></marker></defs><rect width="720" height="180" fill="white"/><text x="40" y="28" font-size="14" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827">One batch, three device stages, consumer work in between</text><rect x="40" y="60" width="100" height="44" rx="8" fill="#dbeafe" stroke="#1f2937"/><rect x="40" y="60" width="100" height="44" rx="8" fill="none" stroke="#dc2626" stroke-width="3" opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0;0.167;1" dur="9s" repeatCount="indefinite"/></rect><text x="90" y="87" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827">IDLE</text><line x1="140" y1="82" x2="150" y2="82" stroke="#1f2937" marker-end="url(#a)"/><rect x="150" y="60" width="100" height="44" rx="8" fill="#fef3c7" stroke="#1f2937"/><rect x="150" y="60" width="100" height="44" rx="8" fill="none" stroke="#dc2626" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.167;0.333;1" dur="9s" repeatCount="indefinite"/></rect><text x="200" y="87" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827">begin</text><line x1="250" y1="82" x2="260" y2="82" stroke="#1f2937" marker-end="url(#a)"/><rect x="260" y="60" width="100" height="44" rx="8" fill="#dbeafe" stroke="#1f2937"/><rect x="260" y="60" width="100" height="44" rx="8" fill="none" stroke="#dc2626" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.333;0.500;1" dur="9s" repeatCount="indefinite"/></rect><text x="310" y="87" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827">VALIDATED</text><line x1="360" y1="82" x2="370" y2="82" stroke="#1f2937" marker-end="url(#a)"/><rect x="370" y="60" width="100" height="44" rx="8" fill="#fef3c7" stroke="#1f2937"/><rect x="370" y="60" width="100" height="44" rx="8" fill="none" stroke="#dc2626" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.500;0.667;1" dur="9s" repeatCount="indefinite"/></rect><text x="420" y="87" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827">admit</text><line x1="470" y1="82" x2="480" y2="82" stroke="#1f2937" marker-end="url(#a)"/><rect x="480" y="60" width="100" height="44" rx="8" fill="#dbeafe" stroke="#1f2937"/><rect x="480" y="60" width="100" height="44" rx="8" fill="none" stroke="#dc2626" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.667;0.833;1" dur="9s" repeatCount="indefinite"/></rect><text x="530" y="87" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827">ADMITTED</text><line x1="580" y1="82" x2="590" y2="82" stroke="#1f2937" marker-end="url(#a)"/><rect x="590" y="60" width="100" height="44" rx="8" fill="#fef3c7" stroke="#1f2937"/><rect x="590" y="60" width="100" height="44" rx="8" fill="none" stroke="#dc2626" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.833;1.000;1" dur="9s" repeatCount="indefinite"/></rect><text x="640" y="87" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827">publish</text><text x="40" y="150" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827"><tspan>The transaction is idle. Commands wait in device buffers.<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0;0.167;1" dur="9s" repeatCount="indefinite"/></tspan></text><text x="40" y="150" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827"><tspan>begin: check each handle, prototype and the batch sequence number.<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.167;0.333;1" dur="9s" repeatCount="indefinite"/></tspan></text><text x="40" y="150" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827"><tspan>Your validators may now reject requests. They may not accept rejected ones.<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.333;0.500;1" dur="9s" repeatCount="indefinite"/></tspan></text><text x="40" y="150" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827"><tspan>admit: assign a free identity and a free row to each surviving request.<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.500;0.667;1" dur="9s" repeatCount="indefinite"/></tspan></text><text x="40" y="150" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827"><tspan>You initialize each destination row, then write the acknowledgement.<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.667;0.833;1" dur="9s" repeatCount="indefinite"/></tspan></text><text x="40" y="150" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827"><tspan>publish: commit acknowledged requests, advance generations, back to IDLE.<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.833;1.000;1" dur="9s" repeatCount="indefinite"/></tspan></text><text x="40" y="172" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6b7280">blue = directory phase, yellow = directory operation, red outline = current step</text></svg>