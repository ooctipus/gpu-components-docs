<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" width="640" height="210"><rect width="640" height="210" fill="white"/><text x="40" y="28" font-size="14" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827">A population of 8 rows over four steps</text><text x="105" y="48" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827">id 7 gen 1<animate attributeName="opacity" values="1;1;0;0;0;0;0;0" keyTimes="0;0.25;0.26;0.5;0.51;0.75;0.76;1" dur="8s" repeatCount="indefinite"/></text>
<text x="105" y="48" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827">id 21 gen 1<animate attributeName="opacity" values="0;0;0;0;1;1;1;1" keyTimes="0;0.25;0.26;0.5;0.51;0.75;0.76;1" dur="8s" repeatCount="indefinite"/></text>
<text x="315" y="48" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827">id 3 gen 2<animate attributeName="opacity" values="1;1;0;0;0;0;0;0" keyTimes="0;0.25;0.26;0.5;0.51;0.75;0.76;1" dur="8s" repeatCount="indefinite"/></text><rect x="40" y="60" width="50" height="40" rx="6" fill="#2563eb" stroke="#1f2937"></rect><text x="65" y="118" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">row 0</text><rect x="110" y="60" width="50" height="40" rx="6" fill="#2563eb" stroke="#1f2937"></rect><text x="135" y="118" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">row 1</text><rect x="180" y="60" width="50" height="40" rx="6" fill="#2563eb" stroke="#1f2937"><animate attributeName="fill" values="#2563eb;#2563eb;#e5e7eb;#e5e7eb;#16a34a;#16a34a;#16a34a;#16a34a" keyTimes="0;0.25;0.26;0.5;0.51;0.75;0.76;1" dur="8s" repeatCount="indefinite"/></rect><text x="205" y="118" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">row 2</text><rect x="250" y="60" width="50" height="40" rx="6" fill="#2563eb" stroke="#1f2937"></rect><text x="275" y="118" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">row 3</text><rect x="320" y="60" width="50" height="40" rx="6" fill="#2563eb" stroke="#1f2937"></rect><text x="345" y="118" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">row 4</text><rect x="390" y="60" width="50" height="40" rx="6" fill="#2563eb" stroke="#1f2937"><animate attributeName="fill" values="#2563eb;#2563eb;#e5e7eb;#e5e7eb;#e5e7eb;#e5e7eb;#e5e7eb;#e5e7eb" keyTimes="0;0.25;0.26;0.5;0.51;0.75;0.76;1" dur="8s" repeatCount="indefinite"/></rect><text x="415" y="118" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">row 5</text><rect x="460" y="60" width="50" height="40" rx="6" fill="#2563eb" stroke="#1f2937"></rect><text x="485" y="118" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">row 6</text><rect x="530" y="60" width="50" height="40" rx="6" fill="#2563eb" stroke="#1f2937"></rect><text x="555" y="118" text-anchor="middle" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">row 7</text><text x="40" y="160" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827">
<tspan>live = 8. Every row holds an instance.<animate attributeName="opacity" values="1;1;0;0;0;0;0;0" keyTimes="0;0.25;0.26;0.5;0.51;0.75;0.76;1" dur="8s" repeatCount="indefinite"/></tspan></text>
<text x="40" y="160" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827"><tspan>Two episodes end. Rows 2 and 5 are freed; their handles are retired, not reused.<animate attributeName="opacity" values="0;0;1;1;0;0;0;0" keyTimes="0;0.25;0.26;0.5;0.51;0.75;0.76;1" dur="8s" repeatCount="indefinite"/></tspan></text>
<text x="40" y="160" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827"><tspan>A new instance is created. It gets a new identity and a free row; live = 7.<animate attributeName="opacity" values="0;0;0;0;1;1;0;0" keyTimes="0;0.25;0.26;0.5;0.51;0.75;0.76;1" dur="8s" repeatCount="indefinite"/></tspan></text>
<text x="40" y="160" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#111827"><tspan>Row 5 stays free. Nothing was reallocated and no graph was re-captured.<animate attributeName="opacity" values="0;0;0;0;0;0;1;1" keyTimes="0;0.25;0.26;0.5;0.51;0.75;0.76;1" dur="8s" repeatCount="indefinite"/></tspan></text><rect x="40" y="180" width="14" height="14" fill="#2563eb"/><text x="60" y="192" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">live</text><rect x="110" y="180" width="14" height="14" fill="#16a34a"/><text x="130" y="192" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">created this step</text><rect x="270" y="180" width="14" height="14" fill="#e5e7eb" stroke="#9ca3af"/><text x="290" y="192" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#374151">free</text></svg>